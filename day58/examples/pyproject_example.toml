# pyproject.toml 完整模板

[build-system]
requires = [\"hatchling\"]
build-backend = \"hatchling.build\"

[project]
name = \"python-awesome-tool\"
dynamic = [\"version\"]
description = \"一个awesome的Python工具\"
readme = \"README.md\"
license = \"MIT\"
requires-python = \">=3.10\"
authors = [
    {name = \"Your Name\", email = \"you@example.com\"},
]
keywords = [\"python\", \"tool\"]
classifiers = [
    \"Development Status :: 4 - Beta\",
    \"Programming Language :: Python :: 3.10\",
    \"Programming Language :: Python :: 3.11\",
    \"Programming Language :: Python :: 3.12\",
]
dependencies = [
    \"click>=8.0\",
    \"rich>=13.0\",
]

[project.optional-dependencies]
dev = [\"pytest>=7.0\", \"ruff>=0.1.0\", \"mypy>=1.0\"]

[project.scripts]
awesome-tool = \"awesome_tool.cli:main\"

[project.urls]
Homepage = \"https://github.com/you/awesome-tool\"
Repository = \"https://github.com/you/awesome-tool\"

[tool.hatch.version]
path = \"src/awesome_tool/__init__.py\"

[tool.hatch.build.targets.wheel]
packages = [\"src/awesome_tool\"]

[tool.ruff]
line-length = 88
target-version = \"py310\"

[tool.mypy]
python_version = \"3.10\"
strict = true

[tool.pytest.ini_options]
testpaths = [\"tests\"]
